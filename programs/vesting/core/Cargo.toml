[package]
name    = "antumbra-vesting-core"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Instructions, effects, state and the plan/apply logic of antumbra_vesting on LEZ v0.3."

[dependencies]
antumbra   = { path = "../../..", default-features = false }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh      = { version = "1.5", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
