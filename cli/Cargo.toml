# `antumbra-vesting`: the client for antumbra_vesting on LEZ v0.3, built on the
# v0.3.0 `wallet` crate. It signs with the wallet's keys, names an LGO fee
# payer for public transactions, and proves private claims locally.
[workspace]

[package]
name = "antumbra-vesting-cli"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "antumbra-vesting"
path = "src/main.rs"

[dependencies]
antumbra-vesting-core = { path = "../programs/vesting/core" }
wallet     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
lee        = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
lee_core   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77", features = ["host"] }
common     = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
programs   = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77", features = ["artifacts"] }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
risc0-binfmt = "3.0"
tokio  = { version = "1", features = ["macros", "rt-multi-thread"] }
clap   = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
hex    = "0.4"
borsh  = { version = "1.5", features = ["derive"] }
serde_json = "1"
