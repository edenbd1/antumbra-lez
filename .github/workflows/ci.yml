name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests, lints, and the differential oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy, warnings are errors
        run: cargo clippy --all-targets -- -D warnings

      # Release, not debug: the release profile sets overflow-checks = true, so
      # a missed checked_* panics here rather than wrapping in production. Running
      # the suite in debug would test different arithmetic from the one that ships.
      - name: Tests
        run: |
          set -o pipefail
          cargo test --release --verbose 2>&1 | tee /tmp/tests.txt

      # The README opens by saying how many tests are green, and that number is
      # quoted outward. Nothing compared it to the suite: a suite that grows does
      # not fail, it simply runs more tests than the sentence about it admits.
      # `set -o pipefail` above is load-bearing — without it `tee` returns zero and
      # a failing suite reaches this step wearing a green tick.
      - name: The README's test count is what the suite actually passes
        run: ./scripts/check-test-count.py - < /tmp/tests.txt

      # The vectors are committed, but they are only trustworthy if the generator
      # still produces them. Regenerating and diffing catches a vector file edited
      # to make a failing test pass.
      - name: The committed vectors still match their generators
        run: |
          python3 tests/gen_vectors.py > /tmp/mul_div.txt
          python3 tests/gen_pow_vectors.py > /tmp/pow.txt
          diff -q /tmp/mul_div.txt tests/vectors/mul_div.txt
          diff -q /tmp/pow.txt tests/vectors/pow.txt
          echo "both oracles reproduce byte for byte"

  cycles:
    name: Cycle counts still match CYCLES.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: RISC0
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: Guest toolchain
        run: rzup install

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zkvm/target
            executor-tests/target
          key: zkvm-${{ hashFiles('zkvm/**/Cargo.toml', 'executor-tests/Cargo.toml', 'programs/*/core/Cargo.toml', 'src/**') }}

      # The executor only — no proving. These are the counts that decide whether
      # an operation fits LEZ's public-execution budget, and they are
      # deterministic, which is what makes them worth asserting rather than
      # merely reporting.
      - name: Measure, and fail if the published table has drifted
        working-directory: zkvm
        run: cargo run --release | tee /tmp/cycles.txt && python3 verify_cycles.py < /tmp/cycles.txt

      # The deployed binary itself, run through the sequencer's execution path:
      # every requirement test that accepts or refuses an instruction, then the
      # per-instruction cost table, which must match the committed one.
      # The v0.3 programs' plan and apply, on the host, without a zkVM.
      - name: The vesting core's own tests
        run: cargo test --release --manifest-path programs/vesting/Cargo.toml -p antumbra-vesting-core

      - name: The curve and LBP cores' own tests
        run: |
          cargo test --release --manifest-path programs/curve/Cargo.toml -p antumbra-curve-core
          cargo test --release --manifest-path programs/lbp/Cargo.toml -p antumbra-lbp-core

      # SPEL generated the v0.2.4 IDLs; it has no v0.3 support, so the v0.3
      # IDLs are hand-maintained and this is what notices when they stop being
      # true: vesting, curve and LBP.
      - name: The hand-maintained v0.3 IDLs decode the programs' own vectors
        run: python3 scripts/check-idl.py

      # The committed v0.3 binaries through lee::V03State: signed transactions,
      # timestamp windows, the real token program, the 10M gas cap.
      - name: The committed vesting, curve and LBP binaries accept and refuse what the RFPs say
        working-directory: executor-tests
        run: cargo test --release

      - name: Whole-instruction costs still match executor-tests/CYCLES.md
        working-directory: executor-tests
        run: |
          cargo run --release --bin measure | grep '^|' > /tmp/instr.md
          grep '^|' CYCLES.md | diff - /tmp/instr.md

      - name: Publish the table to the run summary
        if: always()
        run: |
          {
            echo '## Measured cycle counts'
            echo
            sed -n '/^| op |/,/^$/p' /tmp/cycles.txt
          } >> "$GITHUB_STEP_SUMMARY"

  # Each committed v0.3 binary is what a clean rebuild of the tree produces, in
  # RISC Zero's pinned Docker builder (r0.1.91.1, the tag LEZ v0.3.0 builds its
  # own programs with). The ImageID a v0.3 program header stores is computed
  # from these bytes, so a matching rebuild is the program a deployment names.
  # The v0.2.4 deploy-hash check this job used to run is history: that chain
  # was upgraded and the hash no longer resolves.
  reproduce:
    name: A clean rebuild is the committed v0.3 ${{ matrix.program }} program
    strategy:
      fail-fast: false
      matrix:
        program: [vesting, curve, lbp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RISC0
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      # The build itself runs in the pinned Docker image; cargo-risczero still
      # refuses to start without a host guest toolchain installed.
      - name: cargo-risczero 3.0.5
        run: |
          rzup install cargo-risczero 3.0.5
          rzup install rust

      - name: Rebuild in Docker
        env:
          RISC0_DOCKER_CONTAINER_TAG: r0.1.91.1
        run: cargo risczero build --manifest-path programs/${{ matrix.program }}/Cargo.toml

      - name: The rebuild is the committed artifact, byte for byte
        env:
          P: ${{ matrix.program }}
        run: |
          set -e
          built=$(sha256sum programs/$P/target/riscv32im-risc0-zkvm-elf/docker/antumbra_$P.bin | cut -d' ' -f1)
          committed=$(sha256sum artifacts/programs/v0.3/antumbra_$P.bin | cut -d' ' -f1)
          echo "rebuilt    $built"; echo "committed  $committed"
          [ "$built" = "$committed" ]
          echo "the v0.3 antumbra_$P rebuild matches the committed artifact ($committed)" >> "$GITHUB_STEP_SUMMARY"

  # The Basecamp module, built the way the catalog builds modules: mkLogosModule
  # (app/flake.nix), `nix build .#lgx-portable`, on both platforms Basecamp
  # 0.3.0 ships for. The builder's Qt is 6.9.2, the version Basecamp bundles,
  # and a ceiling, since Qt refuses a plugin built against a newer minor. On
  # macOS the packaged dylib is then unpacked and driven through every step
  # Basecamp's loader takes for a `ui` module, against an official Qt 6.9.2.
  module:
    name: Basecamp module (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: module.json and src/metadata.json mirror metadata.json
        run: cmp app/metadata.json app/module.json && cmp app/metadata.json app/src/metadata.json
      - name: Build the portable package
        run: nix build ./app#lgx-portable --accept-flake-config -L -o result
      - name: Check the package
        run: |
          set -euo pipefail
          cp result/*.lgx antumbra_lez.lgx
          mkdir pkg && tar xzf antumbra_lez.lgx -C pkg
          python3 - <<'PYCHECK'
          import json, os
          m = json.load(open("pkg/manifest.json"))
          meta = json.load(open("app/metadata.json"))
          variants = sorted(os.listdir("pkg/variants"))
          print("name", m["name"], "version", m["version"], "type", m["type"], "variants", variants)
          assert m["name"] == meta["name"] and m["version"] == meta["version"]
          assert m["type"] == "ui", m["type"]
          assert variants, "no variant"
          for v in variants:
              main = m["main"][v]
              assert os.path.exists(f"pkg/variants/{v}/{main}"), main
          PYCHECK
      - name: Qt 6.9.2, the version Basecamp bundles
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 -m venv /tmp/aqt
          /tmp/aqt/bin/pip -q install aqtinstall
          /tmp/aqt/bin/python -m aqt install-qt mac desktop 6.9.2 clang_64 -m qtremoteobjects \
            --archives qtbase qtdeclarative qtshadertools --outputdir /tmp/Qt
          test -d /tmp/Qt/6.9.2/macos/lib/QtQuickWidgets.framework
          test -d /tmp/Qt/6.9.2/macos/lib/QtRemoteObjects.framework
          # The plugin names libintl by @rpath; Basecamp bundles it, aqt's Qt does not.
          nix build nixpkgs#gettext -o gettext
      - name: Build the load harness
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          QT=/tmp/Qt/6.9.2/macos
          # -include arm_acle.h: Qt 6.9.2's qyieldcpu.h calls __yield() without
          # declaring it, which the runner's newer Xcode clang makes an error.
          # It changes how the harness compiles, not the module under test.
          clang++ -std=c++17 -Wall -Wextra -include arm_acle.h -F$QT/lib \
            -I$QT/lib/QtCore.framework/Headers -I$QT/lib/QtGui.framework/Headers \
            -I$QT/lib/QtWidgets.framework/Headers \
            -framework QtWidgets -framework QtGui -framework QtCore \
            -Wl,-rpath,$QT/lib app/tests/ui_plugin_load_test.cpp -o ui_plugin_load_test
      - name: The packaged darwin-arm64 dylib loads the way Basecamp loads a ui plugin
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: /tmp/Qt/6.9.2/macos/plugins
        run: |
          set -euo pipefail
          DYLD_FALLBACK_LIBRARY_PATH="$(readlink -f gettext)/lib" \
            ./ui_plugin_load_test pkg/variants/darwin-arm64/antumbra_lez_plugin.dylib antumbra_lez_plugin 2>&1 | tee load.out
          grep -q "assertions, all of them ran" load.out \
            || { echo "the harness did not report a complete run"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra_lez-${{ runner.os }}-${{ runner.arch }}
          path: antumbra_lez.lgx

  # One .lgx carrying both variants, as the catalog publishes it.
  module-package:
    name: Basecamp module, both platforms in one package
    needs: module
    runs-on: ubuntu-24.04
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge macOS and Linux into one .lgx
        run: |
          set -euo pipefail
          nix build github:logos-co/logos-package --accept-flake-config -o lgxtool
          ./lgxtool/bin/lgx merge parts/*/antumbra_lez.lgx -o antumbra_lez.lgx -y
          ./lgxtool/bin/lgx verify antumbra_lez.lgx
          mkdir m && tar xzf antumbra_lez.lgx -C m && ls m/variants
          test -d m/variants/linux-amd64 && test -d m/variants/darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra_lez-all-platforms
          path: antumbra_lez.lgx

  # Model checking, not testing: each harness in src/vesting/proofs.rs is
  # checked by Kani for every input in its stated domain — every u64 timestamp,
  # totals and durations bounded as the file explains. A property that fails
  # anywhere in that domain fails here with a counterexample.
  kani:
    name: The vesting invariants, model-checked with Kani
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Every harness in src/vesting/proofs.rs
        uses: model-checking/kani-github-action@v1
        with:
          args: -Z stubbing

  # Documentation rots in three ways that are decidable from the tree alone: a
  # path in backticks that is not in it, a link whose target does not resolve
  # from the document carrying it, and a line citation past the end of its file.
  # This gate was added after DEPLOYMENTS.md spent several commits quoting
  # `artifacts/lez/programs/authenticated_transfer.bin` as though it were a file
  # here — it is one in logos-blockchain/logos-execution-zone, and the claim
  # around it was correct, but a reader who went looking found nothing.
  docs:
    name: The documentation points at things that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The vesting evidence page is what the replay log says
        run: python3 scripts/render-vesting-evidence.py --check

      - name: Every quoted path, link and line citation resolves
        run: |
          set -e -o pipefail
          ./scripts/check-docs.py | tee docs.out
          # Floors, because every class here can pass by matching nothing: a
          # regex that stops seeing documents reports zero failures, which is
          # the same exit code and the same green tick as a clean tree.
          p=$(sed -n 's/^examined \([0-9]*\) repository path(s), \([0-9]*\) link(s).*/\1/p' docs.out)
          l=$(sed -n 's/^examined \([0-9]*\) repository path(s), \([0-9]*\) link(s).*/\2/p' docs.out)
          [ -n "$p" ] && [ -n "$l" ] || { echo "it printed no coverage line"; exit 1; }
          [ "$p" -ge 12 ] || { echo "only $p path(s) examined, under the floor of 12: the matcher is not seeing the documents"; exit 1; }
          [ "$l" -ge 4 ] || { echo "only $l link(s) examined, under the floor of 4: the matcher is not seeing the documents"; exit 1; }
