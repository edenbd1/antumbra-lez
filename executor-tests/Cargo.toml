# Runs the committed antumbra_vesting binary through the same execution path the
# LEZ sequencer uses for a public transaction — same input order, same 32M cycle
# session limit, same executor — and checks what it accepts, what it refuses, and
# what state it writes. Also the per-instruction cycle table (RFP-017 P2).
#
# Its own workspace, like zkvm/: the host crate pulls in the RISC0 executor, which
# the pricing library must not depend on.
[workspace]

[package]
name = "antumbra-executor-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "47eba256479f6f785acbd138834340703cd03401", features = ["host"] }
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
risc0-binfmt = "3.0"
serde = { version = "1", features = ["derive"] }
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
bytemuck = "1"
anyhow = "1"

[[bin]]
name = "measure"
path = "src/measure.rs"
